<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý phòng khám</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#f5f5f2; --surface:#fcfcfb; --surface-2:#f0efeb; --surface-3:#e8e7e2;
  --text:#0b0b0b; --text-2:#52514e; --muted:#85847e;
  --border:#e3e2dd; --grid:#ebeae6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --accent:#1f5fb0; --accent-ink:#fff;
  --danger:#c03232;
  --warn-bg:#fff4dc; --warn-ink:#7a4b00; --warn-line:#e8b44a;
  --info-bg:#e9f1fb; --info-ink:#1d4f8f;
  --ok-bg:#e5f5ec; --ok-ink:#17643c;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#222220; --surface-3:#2b2b29;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
    --border:#2f2f2c; --grid:#272725;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --accent:#3987e5; --danger:#e66767;
    --warn-bg:#3a2c0b; --warn-ink:#f2cf86; --warn-line:#8a6a1f;
    --info-bg:#16263a; --info-ink:#a9c8ef;
    --ok-bg:#12301f; --ok-ink:#93d9b0;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#222220; --surface-3:#2b2b29;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
  --border:#2f2f2c; --grid:#272725;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --accent:#3987e5; --danger:#e66767;
  --warn-bg:#3a2c0b; --warn-ink:#f2cf86; --warn-line:#8a6a1f;
  --info-bg:#16263a; --info-ink:#a9c8ef;
  --ok-bg:#12301f; --ok-ink:#93d9b0;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

header.top{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 4px;flex-wrap:wrap}
.brand h1{font-size:17px;margin:0;font-weight:700}
.brand .sub{font-size:12.5px;color:var(--text-2)}
.brand .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:9px 11px;text-decoration:none;color:var(--text-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs a.on{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs a .cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--surface-3);font-size:11.5px;text-align:center;margin-left:4px;color:var(--text)}

select,input[type=text],input[type=date],input[type=search],input[type=number],input[type=tel],textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-height:36px;width:100%}
textarea{resize:vertical}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 13px;min-height:36px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn.big{min-height:44px;font-size:15px;padding:10px 18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13.5px;color:var(--text-2);font-weight:500}
.seg button.on{background:var(--text);color:var(--surface)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .hint{font-weight:400;color:var(--muted);font-size:12.5px}
.card h2 .sp{flex:1}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.page{padding:16px 0 80px}
.cols{display:grid;gap:14px}
.cols > *{min-width:0}
.c-reception{grid-template-columns:minmax(320px,420px) 1fr}
.c-exam{grid-template-columns:260px 1fr}
.c-disp{grid-template-columns:280px 1fr}
@media (max-width:980px){.c-reception,.c-exam,.c-disp{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile .lab{font-size:12.5px;color:var(--text-2)}
.tile .val{font-size:clamp(18px,3vw,24px);font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.tile .val small{font-size:.6em;font-weight:500;color:var(--text-2)}
.tile .note{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.field label{font-size:12.5px;color:var(--text-2);font-weight:500}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.sm{font-size:12.5px;color:var(--muted)}
.muted{color:var(--text-2)}
.bad{color:var(--danger)}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 9px;border-radius:999px;white-space:nowrap;font-weight:500;background:var(--surface-2);color:var(--text-2)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.st-cho-kham{background:var(--warn-bg);color:var(--warn-ink)}
.st-dang-kham{background:var(--info-bg);color:var(--info-ink)}
.st-cho-soan{background:#f3e8fb;color:#6a2e95}
.st-xong{background:var(--ok-bg);color:var(--ok-ink)}
:root[data-theme="dark"] .st-cho-soan{background:#2c1d38;color:#d6b4ef}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .st-cho-soan{background:#2c1d38;color:#d6b4ef}}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:600;color:var(--text-2);text-align:left;font-size:12.5px;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:top}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover{background:var(--surface-2)}
.scroll{overflow-x:auto}
.tall{max-height:62vh;overflow:auto}
.tall thead th{position:sticky;top:0;z-index:1}

/* queue list */
.q{display:flex;flex-direction:column;gap:6px}
.qi{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--surface)}
.qi:hover{background:var(--surface-2)}
.qi.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.qi .stt{font-weight:700;font-size:16px;min-width:34px;text-align:center}
.qi .nm{font-weight:600;line-height:1.25}
.qi .meta{font-size:12px;color:var(--muted)}
.qh{font-size:12.5px;color:var(--text-2);font-weight:600;margin:10px 0 2px;display:flex;justify-content:space-between}

/* patient header */
.ph{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ph .big{font-size:20px;font-weight:700;letter-spacing:-.01em}
.ph .stt{font-size:13px;color:var(--text-2)}
.flags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.flag{border-radius:8px;padding:4px 10px;font-size:13px;background:var(--surface-2)}
.flag b{font-weight:600;margin-right:4px}
.flag.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}

/* history */
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.hc{border:1px solid var(--border);border-radius:10px;padding:10px;font-size:13px;background:var(--surface-2)}
.hc .d{font-weight:600}
.hc ul{margin:6px 0;padding-left:16px}
.hc li{margin:1px 0}

/* rx editor */
.rx{width:100%;border-collapse:collapse;font-size:13.5px;min-width:980px}
.rx th{background:var(--surface-2);position:static}
.rx td{padding:4px;border-bottom:1px solid var(--grid);vertical-align:middle}
.rx input,.rx select{min-height:32px;padding:4px 7px;border-radius:6px}
.rx .w-sl{width:70px}.rx .w-gia{width:100px}.rx .w-tien{width:110px}.rx .w-nd{width:64px}.rx .w-ml{width:84px}
.rx td.tien{text-align:right;font-weight:600;white-space:nowrap}
.rx .edited{outline:1.5px dashed var(--warn-line)}
.xbtn{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.xbtn:hover{background:var(--surface-3);color:var(--danger)}
.total{display:flex;justify-content:flex-end;align-items:baseline;gap:12px;padding:12px 4px 0;font-size:15px}
.total b{font-size:24px;letter-spacing:-.02em}

/* autocomplete */
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:340px;overflow:auto;z-index:15;display:none}
.ac-list.show{display:block}
.ac-it{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:13.5px;border-bottom:1px solid var(--grid)}
.ac-it:last-child{border-bottom:0}
.ac-it:hover,.ac-it.on{background:var(--surface-2)}
.ac-it .m{font-size:12px;color:var(--muted)}
.ac-it.het{opacity:.55}
.tag{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:999px;background:var(--surface-3);color:var(--text-2);margin-left:6px;white-space:nowrap}
.tag.red{background:var(--warn-bg);color:var(--warn-ink)}

.banner{border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:12px;display:none}
.banner.info{display:block;background:var(--info-bg);color:var(--info-ink)}
.banner.warn{display:block;background:var(--warn-bg);color:var(--warn-ink)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:11px 18px;border-radius:10px;font-size:14px;z-index:80;display:none;max-width:92vw;text-align:center}
.toast.big{font-size:18px;font-weight:600;padding:16px 26px}
.empty{text-align:center;padding:36px 16px;color:var(--text-2)}
.empty h3{margin:0 0 6px;color:var(--text);font-size:16px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:5vh 12px;overflow:auto}
.ov.show{display:flex}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:16px;padding:20px}
.modal.wide{max-width:920px}
.modal h3{margin:0 0 14px;font-size:17px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.actions .left{margin-right:auto}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px}
.bars .b{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:10px;align-items:center;font-size:13.5px;padding:3px 0}
.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.bars .tr{height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bars .fl{height:100%;border-radius:5px;background:var(--s1)}
.bars .v{text-align:right;white-space:nowrap}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.12);min-width:170px;display:none;z-index:5}
.prog{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:8px 0}
.prog > div{height:100%;background:var(--accent);width:0}
.dispensed td{color:var(--muted);text-decoration:line-through}
.sticky{position:sticky;top:110px}
.c-day{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:980px){.sticky{position:static}.c-day{grid-template-columns:1fr}}
@media (max-width:700px){.hide-s{display:none}.f3{grid-template-columns:1fr 1fr}}
.foot{color:var(--muted);font-size:12px;padding:10px 0 40px;text-align:center}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div><h1 id="hName">Phòng khám</h1><div class="sub" id="hSub">Quản lý khám bệnh, kê đơn, soạn thuốc</div></div>
      <div class="right">
        <span class="sm" id="who"></span><button class="btn sm" id="btnOut" hidden>Đăng xuất</button>
        <label class="sm" for="selDay">Ngày làm việc</label>
        <input type="date" id="selDay" style="width:auto">
        <button class="btn sm" id="btnToday">Hôm nay</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#tiep-don" data-r="tiep-don">Tiếp đón<span class="cnt" id="cnt-kham" hidden></span></a>
      <a href="#kham-benh" data-r="kham-benh">Khám bệnh</a>
      <a href="#soan-thuoc" data-r="soan-thuoc">Soạn thuốc<span class="cnt" id="cnt-soan" hidden></span></a>
      <a href="#trong-ngay" data-r="trong-ngay">Quản lý trong ngày</a>
      <a href="#benh-nhan" data-r="benh-nhan">Bệnh nhân</a>
      <a href="#thuoc" data-r="thuoc">Danh mục thuốc</a>
      <a href="#thong-ke" data-r="thong-ke">Thống kê</a>
      <a href="#cai-dat" data-r="cai-dat">Cài đặt</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <div class="banner" id="banner"></div>
  <section class="page" id="v-tiep-don"></section>
  <section class="page" id="v-kham-benh" hidden></section>
  <section class="page" id="v-soan-thuoc" hidden></section>
  <section class="page" id="v-trong-ngay" hidden></section>
  <section class="page" id="v-benh-nhan" hidden></section>
  <section class="page" id="v-thuoc" hidden></section>
  <section class="page" id="v-thong-ke" hidden></section>
  <section class="page" id="v-cai-dat" hidden></section>
</main>
<div class="ov" id="login" style="background:var(--bg)"><div class="modal" style="max-width:400px;margin-top:8vh">
  <h3 id="lgTitle">Đăng nhập</h3>
  <div class="field"><label for="lgEmail">Email</label><input type="text" id="lgEmail" autocomplete="username" inputmode="email"></div>
  <div class="field"><label for="lgPass">Mật khẩu</label><input type="password" id="lgPass" autocomplete="current-password" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-height:36px;width:100%"></div>
  <div class="sm bad" id="lgMsg" style="margin-bottom:8px"></div>
  <div class="actions" style="justify-content:space-between"><button class="btn sm" id="lgForgot">Quên mật khẩu</button><span class="grow"></span><button class="btn" id="lgSignup">Tạo tài khoản</button><button class="btn primary" id="lgGo">Đăng nhập</button></div>
  <p class="sm" style="margin:12px 0 0">Tài khoản chỉ dùng được khi quản trị viên đã thêm email vào danh sách nhân viên.</p>
</div></div>
<div class="ov" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const nf = new Intl.NumberFormat('vi-VN');
const fmt = n => nf.format(Math.round(+n||0));
const fmtQ = n => (+n||0).toLocaleString('vi-VN',{maximumFractionDigits:2});
const money = n => fmt(n) + ' ₫';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n,l=2) => String(n).padStart(l,'0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const HOLDER = uid();
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\s+/g,' ').trim();
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const viDate = s => s ? `${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}` : '';
const THU = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
function dayName(s){ const d = new Date(s+'T00:00:00'); return THU[d.getDay()]; }
function hhmm(iso){ if(!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fnv(str){ let h = 0x811c9dc5; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h>>>0).toString(36); }
function parseMoney(v){
  if (typeof v === 'number') return Math.round(v);
  let s = String(v ?? '').trim(); if (!s) return 0;
  const neg = /^-/.test(s);
  s = s.replace(/[^\d.,]/g,''); if (!s) return 0;
  if (/^\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g,'');
  else if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g,'').replace(',','.');
  else s = s.replace(/,/g,'');
  const n = Math.round(parseFloat(s)||0); return neg ? -n : n;
}
function parseAmount(v){ // accepts 150k, 1,5tr
  const s = norm(v).replace(/\s|₫|vnd|d$/g,'');
  const m = s.match(/^([\d.,]+)(k|tr|trieu)$/);
  if (m){ const b = parseFloat(m[1].replace(',','.')) || 0; return Math.round(b * (m[2]==='k'?1e3:1e6)); }
  return parseMoney(s);
}
function parseQty(v){
  if (typeof v === 'number') return v;
  let s = String(v ?? '').trim(); if (!s) return 0;
  const fr = s.match(/^(\d+)\s*\/\s*(\d+)/); if (fr) return (+fr[1])/(+fr[2]||1);
  s = s.replace(/[^\d.,]/g,'');
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,''); else s = s.replace(',','.');
  return parseFloat(s) || 0;
}
function soLanTrongNgay(buoi){ return String(buoi||'').split(/[,;+\/]| và /).map(x=>x.trim()).filter(Boolean).length; }
function tuoi(ns){ const y = +String(ns||'').slice(-4); return y > 1900 && y <= new Date().getFullYear() ? new Date().getFullYear() - y : ''; }

/* ================= UI primitives ================= */
let toastT;
function toast(msg, big){ const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (big?' big':''); t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(()=> t.style.display='none', big?4500:3000); }

function confirmBox(title, msg, yes){

function errMsg(e){
  const c = e && e.code;
  if (c === 'permission-denied') return 'Tài khoản không có quyền thực hiện thao tác này.';
  if (c === 'unavailable') return 'Mất kết nối mạng, vui lòng thử lại.';
  if (c === 'resource-exhausted') return 'Vượt hạn mức sử dụng Firebase trong ngày.';
  if (c === 'quota_exceeded') return 'Kho dữ liệu đã đầy.';
  if (c === 'invalid_argument') return 'Bạn không có quyền ghi dữ liệu (hoặc dữ liệu không hợp lệ).';
  if (c === 'resource_exhausted') return 'Thao tác quá nhanh, thử lại sau giây lát.';
  if (c === 'revoked') return 'Quyền truy cập đã thay đổi, hãy tải lại trang.';
  return 'Không lưu được, vui lòng thử lại.';
}

/* ================= local fallback store (same API subset as db) ================= */
function LocalDB(){
  const K = 'pk-local-v1'; let store = {};
  try { store = JSON.parse(localStorage.getItem(K) || '{}'); } catch(e){}
  const subs = new Set(); let pt;
  const persist = () => { clearTimeout(pt); pt = setTimeout(()=>{ try { localStorage.setItem(K, JSON.stringify(store)); } catch(e){} }, 200); };
  let nt = null; const notify = () => { if (nt) return; nt = setTimeout(() => { nt = null; subs.forEach(f => f()); }, 120); };
  const parent = p => p.split('/').slice(0,-1).join('/');
  const clone = o => JSON.parse(JSON.stringify(o));
  const snapDoc = p => ({ id: p.split('/').pop(), exists: p in store, data: () => p in store ? clone(store[p]) : undefined, metadata:{fromCache:false,hasPendingWrites:false} });
  const qsnap = c => { const docs = Object.keys(store).filter(k => parent(k) === c).sort().map(snapDoc); return {docs, size:docs.length, empty:!docs.length, metadata:{fromCache:false}, docChanges:()=>[]}; };
  const docRef = p => ({ id: p.split('/').pop(), path: p,
    get: async () => snapDoc(p),
    set: async d => { store[p] = clone(d); persist(); notify(); },
    update: async d => { if (!(p in store)) throw {code:'invalid_argument'}; Object.assign(store[p], clone(d)); persist(); notify(); },
    delete: async () => { delete store[p]; persist(); notify(); },
    acquire: async () => ({acquired:true}),
    onSnapshot: n => { const f = () => n(snapDoc(p)); subs.add(f); setTimeout(f,0); return () => subs.delete(f); },
    collection: c => colRef(p + '/' + c) });
  const colRef = c => ({ path: c, doc: id => docRef(c + '/' + (id || uid())), get: async () => qsnap(c),
    onSnapshot: n => { const f = () => n(qsnap(c)); subs.add(f); setTimeout(f,0); return () => subs.delete(f); } });
  return { doc: docRef, collection: colRef, _local: true };
}

/* ================= data access ================= */
async function withRetry(fn, tries=3){
  for (let i=0;;i++){
    try { return await fn(); }
    catch(e){ const c = e && e.code; if (i < tries-1 && (c==='unavailable' || c==='resource_exhausted' || c==='aborted')){ await sleep((c==='resource_exhausted'?1500:400)*(i+1) + Math.random()*400); continue; } throw e; }
  }
}
function subscribeStatic(){
  S.db.doc('cauhinh/chung').onSnapshot(s => { if (s.exists) S.settings = Object.assign({}, DEFAULT_SETTINGS, s.data()); scheduleRender(); }, e => console.error(e));
  S.db.collection('thuoc').onSnapshot(s => { S.drugs = s.docs.map(d => Object.assign({}, d.data(), {id:d.id})).sort((a,b) => (a.thuTu??9999)-(b.thuTu??9999) || String(a.ten).localeCompare(String(b.ten),'vi')); scheduleRender(); }, e => console.error(e));
  for (let i=0;i<10;i++){
    const sh = 's'+i;
    S.db.collection(`bn/${sh}/ds`).onSnapshot(s => {
      S.patShards[sh] = s.docs.map(d => Object.assign({}, d.data(), {ma:d.id}));
      const m = new Map(); Object.values(S.patShards).forEach(arr => arr.forEach(p => m.set(p.ma, p))); S.patients = m;
      scheduleRender();
    }, e => console.error(e));
  }
}
function subscribeDay(){
  if (S.unsubDay) { try{S.unsubDay();}catch(e){} }
  S.visits = []; S.dayLoaded = false; S.selKham = null; S.selSoan = null; S.draft = null;
  const t = setTimeout(()=>{ if(!S.dayLoaded) setBanner('Chưa tải được dữ liệu ngày này từ máy chủ. Kiểm tra kết nối mạng.', 'warn'); }, 10000);
  S.unsubDay = S.db.collection(visitPath(S.day)).onSnapshot(s => {
    S.visits = s.docs.map(d => Object.assign({}, d.data(), {id:d.id})).sort((a,b) => (a.stt||0)-(b.stt||0));
    if (!s.metadata.fromCache && !S.dayLoaded){ S.dayLoaded = true; clearTimeout(t); if ($('#banner').classList.contains('warn')) setBanner(''); }
    // keep draft in sync if someone else changed status
    scheduleRender();
  }, e => { console.error(e); clearTimeout(t); setBanner('Lỗi tải dữ liệu: ' + (e && e.code), 'warn'); });
}
async function withLease(path, fn){
  if (S.db._fire){ const real = S.db._fs.doc(path); return withRetry(() => S.db._fs.runTransaction(tx => fn({ get: () => tx.get(real), set: d => { tx.set(real, d); return Promise.resolve(); } }))); }
  const ref = S.db.doc(path);
  for (let i=0;i<25;i++){
    let r;
    try { r = await withRetry(()=> ref.acquire({holder:HOLDER, ttlMs:5000})); }
    catch(e){ if (e && (e.code==='revoked' || e.code==='quota_exceeded')) throw e; return await fn(ref); }
    if (r && r.acquired) return await fn(ref);
    await sleep(250 + Math.random()*400);
  }
  throw {code:'unavailable'};
}
function maxPatientNo(){ let mx = 0; S.patients.forEach((p,ma) => { const m = String(ma).match(/(\d+)$/); if (m) mx = Math.max(mx, +m[1]); }); return mx; }
async function nextMaBN(){
  return withLease('meta/dem', async ref => {
    const s = await ref.get(); let last = s.exists ? (+s.data().lastBN||0) : 0;
    last = Math.max(last, maxPatientNo()); const next = last + 1;
    await ref.set({lastBN: next});
    return 'DN.' + pad(next, 5);
  });
}
async function nextSTT(day){
  return withLease(`ngay/${day}`, async ref => {
    const s = await ref.get(); let last = s.exists ? (+s.data().lastSTT||0) : 0;
    const local = day === S.day ? Math.max(0, ...S.visits.map(v => +v.stt||0)) : 0;
    const next = Math.max(last, local) + 1;
    await ref.set({ngay: day, lastSTT: next});
    return next;
  });
}
async function savePatient(p){ const ma = p.ma; const data = Object.assign({}, p); delete data.ma; await withRetry(()=> S.db.collection(`bn/${shardOf(ma)}/ds`).doc(ma).set(data)); S.patients.set(ma, Object.assign({}, p)); }
async function saveVisit(v){ const data = Object.assign({}, v); delete data.id; await withRetry(()=> S.db.collection(visitPath(v.ngay)).doc(v.id).set(data)); }
async function patchVisit(v, patch){ await withRetry(()=> S.db.collection(visitPath(v.ngay)).doc(v.id).update(patch)); }
async function linkVisitToPatient(v){
  if (!v.maBN) return; const p = S.patients.get(v.maBN); if (!p) return;
  const ref = `${v.ngay}/${v.id}`; const lk = Array.isArray(p.lk) ? p.lk.slice() : [];
  if (lk.includes(ref)) return; lk.push(ref); lk.sort();
  await withRetry(()=> S.db.collection(`bn/${shardOf(v.maBN)}/ds`).doc(v.maBN).update({lk, lanCuoi: lk[lk.length-1].slice(0,10)}));
}
async function getVisitByRef(ref){
  if (S.histCache.has(ref)) return S.histCache.get(ref);
  const [day, id] = ref.split('/');
  const s = await withRetry(()=> S.db.collection(visitPath(day)).doc(id).get());
  const v = s.exists ? Object.assign({}, s.data(), {id}) : null;
  S.histCache.set(ref, v); return v;
}

function staffTabs(me){ return Array.isArray(me && me.tabs) ? me.tabs : DEFAULT_STAFF_TABS; }
function canTab(r){
  if (!(S.db && S.db._fire)) return true;

function patientLine(p){ return [p.namSinh, p.diaChi, p.dienThoai].filter(Boolean).join(' · '); }
function searchPatients(q, limit=8){
  const n = norm(q); if (!n) return [];
  const toks = n.split(' ');
  const out = [];
  for (const p of S.patients.values()){
    const hay = p._k || (p._k = norm([p.ten, p.namSinh, p.diaChi, p.dienThoai, p.ma].join(' ')));
    if (toks.every(t => hay.includes(t))) { out.push(p); }
  }
  out.sort((a,b) => String(b.lanCuoi||'').localeCompare(String(a.lanCuoi||'')) || String(a.ten).localeCompare(String(b.ten),'vi'));
  return out.slice(0, limit);
}

    if (!ma){ ma = await nextMaBN(); }
    const old = S.patients.get(ma) || {};
    const p = Object.assign({}, old, info, {ma}); delete p._k; if (!p.taoLuc) p.taoLuc = new Date().toISOString();
    await savePatient(p);
    const stt = await nextSTT(S.day);
    const v = { id: uid(), ngay: S.day, stt, maBN: ma, ten:p.ten, namSinh:p.namSinh||'', diaChi:p.diaChi||'', dienThoai:p.dienThoai||'', luuY:p.luuY||'', tienSu:p.tienSu||'', diUng:p.diUng||'', trangThai:'cho-kham', gioDen:new Date().toISOString(), bacSi:'', chanDoan:'', ghiChu:'', thuoc:[], tongTien:0 };
    await saveVisit(v);

  } catch(e){ console.error(e); $('#tdErr').textContent = errMsg(e); }

}
function editPatientModal(ma, visit){

        await patchVisit(v, {ten:np.ten, namSinh:np.namSinh||'', diaChi:np.diaChi||'', dienThoai:np.dienThoai||'', luuY:np.luuY||'', tienSu:np.tienSu||'', diUng:np.diUng||''});

  };
}

function recalcLine(l, f){
  if (['buoi','moiLan','soNgay'].includes(f)){
    const n = soLanTrongNgay(l.buoi), ml = parseQty(l.moiLan), nd = parseQty(l.soNgay);
    if (n && ml && nd) l.sl = Math.round(n*ml*nd*100)/100;
  }
  if (f === 'tien'){ l.tienSua = Math.round(+l.tien||0) !== Math.round((+l.sl||0)*(+l.donGia||0)); return; }
  if (['sl','donGia','buoi','moiLan','soNgay'].includes(f)){ l.tienSua = false; l.tien = Math.round((+l.sl||0)*(+l.donGia||0)); }
}
function drugToLine(t){
  const sl = parseQty(t.sl) || 1; const dg = +t.donGia || (sl ? Math.round((+t.tien||0)/sl) : (+t.tien||0));
  const tien = (+t.tien > 0) ? Math.round(+t.tien) : Math.round(sl*dg); // giá của mẫu kê trong danh mục (như cột Tiền của file cũ)
  return { ten:t.ten, thuocId:t.id, sl, donGia:dg, tien, tienSua: tien !== Math.round(sl*dg), cachDung:t.cachDung||'', buoi:t.buoi||'', moiLan:t.moiLan||'', soNgay:t.soNgay||'', luuY:t.luuY||'' };
}
function searchDrugs(q){
  const n = norm(q); if (!n) return []; const toks = n.split(' ');
  return S.drugs.filter(t => { const h = t._k || (t._k = norm(t.ten + ' ' + (t.ghiChu||'') + ' ' + (t.buoi||''))); return toks.every(x => h.includes(x)); }).slice(0, 14);
}

  $('#ptLyDo').oninput = e => { d.ptLyDo = e.target.value; };
  const add = $('#khAdd'), ac = $('#khAc'); let idx = 0, res = [];
  const draw = () => { ac.innerHTML = res.map((t,i) => `<div class="ac-it ${i===idx?'on':''} ${t.het?'het':''}" data-i="${i}"><div><b>${esc(t.ten)}</b>${t.het?'<span class="tag red">hết</span>':''}${t.ghiChu&&!t.het?`<span class="tag">${esc(t.ghiChu)}</span>`:''}<div class="m">${esc([t.cachDung,t.buoi,t.moiLan,t.soNgay?t.soNgay+' ngày':''].filter(Boolean).join(' · '))}</div></div><div class="m num" style="text-align:right">SL ${fmtQ(t.sl)}<br>${fmt(t.tien)}</div></div>`).join('') || (add.value.trim() ? `<div class="ac-it" data-free="1"><span>Thêm "<b>${esc(add.value.trim())}</b>" (không có trong danh mục)</span></div>` : ''); ac.classList.toggle('show', !!add.value.trim()); };
  add.oninput = () => { res = searchDrugs(add.value); idx = 0; draw(); };
  add.onkeydown = e => {
    if (e.key==='ArrowDown'){ idx=Math.min(idx+1,res.length-1); draw(); e.preventDefault(); }
    else if (e.key==='ArrowUp'){ idx=Math.max(idx-1,0); draw(); e.preventDefault(); }
    else if (e.key==='Enter'){ e.preventDefault(); if (res[idx]) pickDrug(res[idx]); else if (add.value.trim()) pickFree(add.value.trim()); }
  };
  add.onblur = () => setTimeout(()=> ac.classList.remove('show'), 150);
  ac.onmousedown = e => { const it = e.target.closest('[data-i]'); if (it) pickDrug(res[+it.dataset.i]); else if (e.target.closest('[data-free]')) pickFree(add.value.trim()); };
  function pickDrug(t){ d.thuoc.push(drugToLine(t)); redrawRx(); add.value=''; ac.classList.remove('show'); add.focus(); }
  function pickFree(name){ d.thuoc.push({ten:name, sl:1, donGia:0, tien:0, tienSua:false, cachDung:'', buoi:'', moiLan:'', soNgay:'', luuY:''}); redrawRx(); add.value=''; ac.classList.remove('show'); }

function updTotal(){ const t = S.draft.thuoc.reduce((a,l)=>a+(+l.tien||0),0); $('#rxSum').textContent = money(t); $('#rxTotal').textContent = money(t + (+S.draft.phuThu||0)); }
function bindRx(){
  const d = S.draft;
  $$('#rxBody tr[data-i]').forEach(tr => {
    const l = d.thuoc[+tr.dataset.i];
    $$('input[data-f]', tr).forEach(inp => {
      const f = inp.dataset.f;
      inp.oninput = () => {
        const raw = inp.value;
        if (f==='sl') l.sl = parseQty(raw); else if (f==='donGia') l.donGia = parseAmount(raw); else if (f==='tien') l.tien = parseAmount(raw); else l[f] = raw;
        recalcLine(l, f);
        if (f!=='tien'){ const ti = $('input[data-f=tien]', tr); ti.value = fmt(l.tien); ti.classList.toggle('edited', !!l.tienSua); }

      inp.onblur = () => { if (f==='donGia') inp.value = fmt(l.donGia); if (f==='tien') inp.value = fmt(l.tien); if (f==='sl') inp.value = fmtQ(l.sl); };
    });

        const nl = Object.assign({}, l); if (cat && !l.tienSua){ nl.donGia = +cat.donGia || nl.donGia; nl.tien = Math.round(nl.sl*nl.donGia); }

async function openExam(id){
  const v = S.visits.find(x => x.id === id); if (!v) return;
  if (S.draft && S.draft.id !== id && S.draft._dirty !== false){ /* switching: drafts are not auto-saved */ }
  if (v.trangThai === 'dang-kham' && v.bacSi && S.bacSi && v.bacSi !== S.bacSi){
    if (!(await confirmBox('Bệnh nhân đang được khám', `${v.ten} đang được ${v.bacSi} khám. Vẫn mở?`, 'Vẫn mở'))) return;
  }
  if (!S.bacSi){ toast('Hãy chọn bác sĩ khám trước.'); $('#khBS')?.focus(); return; }
  S.selKham = id;
  const thuoc = (v.thuoc && v.thuoc.length) ? JSON.parse(JSON.stringify(v.thuoc)) : [];
  if (!thuoc.length && (+S.settings.phiKham||0) > 0) thuoc.push({ten:'Khám bệnh', sl:1, donGia:+S.settings.phiKham, tien:+S.settings.phiKham, tienSua:false, cachDung:'', buoi:'', moiLan:'', soNgay:'', luuY:''});
  S.draft = { id:v.id, ngay:v.ngay, maBN:v.maBN, chanDoan:v.chanDoan||'', ghiChu:v.ghiChu||'', thuoc, prevStatus:v.trangThai };
  if (v.thuoc && v.thuoc.length){ S.draft.ptOn = +v.phuThu > 0; S.draft.ptTien = +v.phuThu || +S.settings.phuThu || 0; S.draft.ptLyDo = v.phuThuLyDo || ''; }
  else { const last = lsGet('pk-phuthu-on'); S.draft.ptOn = last == null ? !!S.settings.phuThuMacDinh : last === '1'; S.draft.ptTien = +S.settings.phuThu || 0; S.draft.ptLyDo = ''; }
  S.draft.phuThu = S.draft.ptOn ? S.draft.ptTien : 0;

function canonName(t){ const s = String(t||'').trim(); const m = s.match(/^(.+?)\s*\[\s*([^\]]+?)\s*\]$/); return m ? `[${m[2]}] ${m[1].trim()}` : s.replace(/^\[\s*([^\]]+?)\s*\]\s*/, '[$1] '); }
function drugUsage(visits){
  const m = new Map();
  for (const v of visits) for (const l of (v.thuoc||[])){ if (/^kham benh$/.test(norm(l.ten))) continue; const k = canonName(l.ten); const o = m.get(k) || {ten:k, sl:0, tien:0, n:0}; o.sl += +l.sl||0; o.tien += +l.tien||0; o.n++; m.set(k,o); }
  return [...m.values()].sort((a,b) => b.sl - a.sl);
}

function needX(){ if (!window.XLSX){ toast('Thư viện Excel đang tải, thử lại sau giây lát.'); return false; } return true; }
function numFmt(ws, cols){ const rg = XLSX.utils.decode_range(ws['!ref']); for (let r=rg.s.r; r<=rg.e.r; r++) for (const c of cols){ const cell = ws[XLSX.utils.encode_cell({r,c})]; if (cell && cell.t==='n') cell.z = '#,##0.##'; } }
async function saveWb(name, wb){ const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'}); try { await S.dl.save({filename:name, data:buf}); toast('Đã tải file.'); } catch(e){ if (!(e && e.code==='declined')) toast('Không tải được file (' + (e && e.code || 'lỗi') + ').'); } }
function exportDay(vs, usage){
  if (!S.dl || !needX()) return;
  const a = [['STT','Mã BN','Tên','Năm sinh','Tổng tiền','Địa chỉ','Điện thoại','Lưu ý','Bác sĩ','Tiền sử','Dị ứng','Ngày','Chẩn đoán','Ghi chú (CLS)','Trạng thái']];

  const ws1 = XLSX.utils.aoa_to_sheet(a); numFmt(ws1,[4]);

  const c = [['STT','Mã BN','Tên','Ngày','Bác sĩ','Tên thuốc','Số lượng','Đơn giá','Tiền','Cách dùng','Buổi','Mỗi lần uống','Số ngày','Lưu ý']];
  vs.forEach(v => (v.thuoc||[]).forEach(l => c.push([pad(v.stt,3), v.maBN, v.ten, viDate(v.ngay), v.bacSi, l.ten, +l.sl, +l.donGia, +l.tien, l.cachDung, l.buoi, l.moiLan, l.soNgay, l.luuY])));
  const ws3 = XLSX.utils.aoa_to_sheet(c); numFmt(ws3,[6,7,8]);

    if (S.tkData.key === key) { S.tkData = {key, days:out}; rThongKe(); }

    <div class="card" style="margin-bottom:14px"><h2>Doanh thu theo ngày khám</h2>${days.length?'<div class="chart-wrap" id="tkChart"><div class="tip" id="tkTip"></div></div>':'<div class="sm">Chưa có dữ liệu.</div>'}</div>
    <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">

function niceStep(x){ if (x<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function compact(n){ const a = Math.abs(n); if (a>=1e9) return (n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tỷ'; if (a>=1e6) return (n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tr'; if (a>=1e3) return Math.round(n/1e3)+'k'; return String(n); }
function drawDayChart(days){
  const box = $('#tkChart'); const tip = $('#tkTip');
  const W = Math.max(320, box.clientWidth), H = 230, L = 52, R = 8, T = 10, B = 28;
  const max = Math.max(1, ...days.map(d => d.tien)); const step = niceStep(max/4); const top = Math.ceil(max/step)*step;
  const y = v => T + (H-T-B)*(1 - v/top); const band = (W-L-R)/days.length; const bw = Math.max(4, Math.min(24, band-6));
  let g = ''; for (let v=0; v<=top+1e-6; v+=step) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v?compact(v):'0'}</text>`;
  let bars = '', hits = ''; const every = Math.ceil(days.length / Math.max(1, Math.floor((W-L)/48)));
  days.forEach((d,i) => { const cx = L + i*band + band/2; const h = y(0)-y(d.tien); const r = Math.min(4,h,bw/2);
    if (h > 0) bars += `<path d="M${cx-bw/2},${y(0)}V${y(d.tien)+r}Q${cx-bw/2},${y(d.tien)} ${cx-bw/2+r},${y(d.tien)}H${cx+bw/2-r}Q${cx+bw/2},${y(d.tien)} ${cx+bw/2},${y(d.tien)+r}V${y(0)}Z" fill="var(--s1)"/>`;
    if (i % every === 0) bars += `<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.day.slice(8,10)}/${d.day.slice(5,7)}</text>`;
    hits += `<rect data-i="${i}" x="${L+i*band}" y="${T}" width="${band}" height="${H-T-B}" fill="transparent"/>`; });

function bindImp(){ const g = $('#impGo'); if (g) g.onclick = runImport; }
function cell(v){ return v == null ? '' : (typeof v === 'string' ? v.trim() : v); }
function parseNS(v){
  if (typeof v === 'number'){ if (v > 1900 && v < 2100) return String(v); if (v > 3000 && v < 80000 && window.XLSX){ const d = XLSX.SSF.parse_date_code(v); return String(d.y); } return String(v); }
  const s = String(v||'').trim(); const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m && +m[3] >= 1899 && +m[3] <= 1910){ const serial = Math.round((Date.UTC(+m[3], +m[2]-1, +m[1]) - Date.UTC(1899,11,30))/86400000); if (serial > 1900 && serial < 2100) return String(serial); }
  return s;
}
function parseDay(v){
  if (typeof v === 'number' && window.XLSX){ const d = XLSX.SSF.parse_date_code(v); return d && d.y > 2000 ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : null; }
  const s = String(v||'').trim(); if (/^\d{5}(\.\d+)?$/.test(s) && window.XLSX) return parseDay(parseFloat(s));
  const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? `${m[3]}-${pad(m[2])}-${pad(m[1])}` : null;
}
function findSheet(wb, name){ const n = norm(name); return wb.SheetNames.find(s => norm(s) === n) || wb.SheetNames.find(s => norm(s).includes(n)); }
async function readImport(f){
  if (!needX()) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
    const rows = n => { const s = findSheet(wb, n); return s ? XLSX.utils.sheet_to_json(wb.Sheets[s], {header:1, raw:true, defval:''}) : null; };
    // --- drugs
    const drugs = []; const dr = rows('Danh mục thuốc');
    if (dr){ let order = 0; for (const r of dr){ const ten = cell(r[1]); if (!ten || norm(ten)==='ten thuoc') continue;
      const note = String(cell(r[0])); const het = norm(note)==='het';
      const sl = parseQty(r[2]) || 1; const tien = parseMoney(r[3]); let dg = parseMoney(r[9]); if (!dg) dg = sl ? Math.round(tien/sl) : tien;
      const t = { ten:String(ten), ghiChu: het?'':note, het, sl, tien: tien || Math.round(sl*dg), donGia: dg, cachDung:String(cell(r[4])), buoi:String(cell(r[5])), moiLan:String(cell(r[6])), soNgay:String(cell(r[7])), luuY:String(cell(r[8])), thuTu: order++ };
      t.id = 'd' + fnv(t.ten + '|' + t.sl + '|' + t.buoi); drugs.push(t); } }
    // --- patients
    const pats = new Map(); const pr = rows('Thông tin Bệnh nhân');
    if (pr){ const hi = pr.findIndex(r => norm(r[0]) === 'ma bn'); for (const r of pr.slice(hi+1)){ const ma = String(cell(r[0])); const ten = String(cell(r[1])); if (!/^[A-Za-z]+\.\d+$/.test(ma) || !ten) continue; pats.set(ma, {ma, ten, namSinh:parseNS(r[2]), diaChi:String(cell(r[3])), dienThoai:String(cell(r[4])), luuY:String(cell(r[5])), tienSu:String(cell(r[6])), diUng:String(cell(r[7])), lk:[]}); } }
    // --- old prescriptions (blocks starting with "STT")
    const visits = []; const vr = rows('Toa thuốc cũ'); const doctors = new Set();
    if (vr){
      let cur = null; const flush = () => { if (cur && cur.ngay && (cur.ten || cur.maBN)) visits.push(cur); cur = null; };
      const LBL = {'ma benh nhan':'maBN','ngay gio':'ngayRaw','bac si':'bacSi','ten':'ten','nam sinh':'namSinh','dia chi':'diaChi','so dien thoai':'dienThoai','dien thoai':'dienThoai','luu y':'luuY','tien su':'tienSu','di ung':'diUng','chan doan':'chanDoan','ghi chu lan kham nay':'ghiChu','tong tien':'tongTien'};
      for (const r of vr){
        const a = norm(r[0]);
        if (a === 'stt'){ flush(); cur = {stt: parseInt(r[1])||0, thuoc:[]}; continue; }
        if (!cur) continue;
        const key = LBL[a]; if (key){ const v = r[1]; if (key==='ngayRaw') cur.ngay = parseDay(v); else if (key==='tongTien') cur.tongTien = parseMoney(v); else if (key==='namSinh') cur.namSinh = parseNS(v); else cur[key] = String(cell(v)); }
        const ten = String(cell(r[4])); if (ten && norm(ten) !== 'ten thuoc'){
          const sl = parseQty(r[5]); const tien = parseMoney(r[6]); const dg = parseMoney(r[12]) || (sl ? Math.round(tien/sl) : tien);
          cur.thuoc.push({ten, sl, donGia:dg, tien, tienSua: Math.round(sl*dg) !== tien, cachDung:String(cell(r[7])), buoi:String(cell(r[8])), moiLan:String(cell(r[9])), soNgay:String(cell(r[10])), luuY:String(cell(r[11]))});
        }
      }
      flush();
      for (const v of visits){
        v.id = 'im' + fnv((v.maBN||v.ten) + '|' + v.ngay + '|' + v.stt);
        const lineSum = v.thuoc.reduce((x,l)=>x+(+l.tien||0),0);
        if (!v.tongTien) v.tongTien = lineSum; else if (v.tongTien > lineSum) v.phuThu = v.tongTien - lineSum;
        v.trangThai = 'xong'; v.gioDen = ''; if (v.bacSi) doctors.add(v.bacSi);
        if (v.maBN && !pats.has(v.maBN) && !S.patients.has(v.maBN)) pats.set(v.maBN, {ma:v.maBN, ten:v.ten||'', namSinh:v.namSinh||'', diaChi:v.diaChi||'', dienThoai:v.dienThoai||'', luuY:v.luuY||'', tienSu:v.tienSu||'', diUng:v.diUng||'', lk:[]});
      }
    }
    const bs = rows('Thông tin Bác sĩ');
    if (bs){ const hi = bs.findIndex(r => norm(r[0]) === 'ma bs'); bs.slice(hi+1).forEach(r => { const n = String(cell(r[1])); if (n && !/nghi/.test(norm(r[4]))) doctors.add(n); }); }
    const daysSet = new Set(visits.map(v => v.ngay));
    S.imp = { drugs, pats, visits, doctors:[...doctors], counts:{drugs:drugs.length, patients:pats.size, visits:visits.length, days:daysSet.size, doctors:doctors.size},
      warn: (!dr && !pr && !vr) ? '' : visits.filter(v=>!v.maBN).length ? `${visits.filter(v=>!v.maBN).length} lượt khám không có mã BN sẽ được nhập nhưng không gắn vào hồ sơ.` : '' };
    if (!dr && !pr && !vr) S.imp = {error:'Không tìm thấy các trang "Danh mục thuốc", "Thông tin Bệnh nhân", "Toa thuốc cũ" trong file.'};
  } catch(e){ console.error(e); S.imp = {error:'Không đọc được file này.'}; }
  $('#impBox').innerHTML = impHTML(); bindImp();
}
async function runImport(){

  const ops = [];

    I.visits.forEach(v => { if (v.maBN){ if (!lkMap.has(v.maBN)) lkMap.set(v.maBN, []); lkMap.get(v.maBN).push(`${v.ngay}/${v.id}`); } dayMax.set(v.ngay, Math.max(dayMax.get(v.ngay)||0, v.stt||0)); });
    I.lkMap = lkMap;
    dayMax.forEach((mx, day) => ops.push(async () => { const ref = S.db.doc(`ngay/${day}`); const s = await ref.get(); const last = s.exists ? (+s.data().lastSTT||0) : 0; await ref.set({ngay:day, lastSTT:Math.max(last, mx)}); }));
    I.visits.forEach(v => { const d = Object.assign({}, v); delete d.id; ops.push(() => S.db.collection(visitPath(v.ngay)).doc(v.id).set(d)); });
  }
  if (doP || doV){
    const mas = new Set([...(doP ? I.pats.keys() : []), ...(doV && I.lkMap ? I.lkMap.keys() : [])]);
    mas.forEach(ma => ops.push(async () => {
      const ex = S.patients.get(ma); const base = Object.assign({}, ex || {}, (doP && I.pats.get(ma)) ? I.pats.get(ma) : (!ex ? I.pats.get(ma) : {}));
      if (!base || !base.ten) return;
      const lk = [...new Set([...(ex && ex.lk || []), ...((I.lkMap && I.lkMap.get(ma)) || [])])].sort();
      const p = Object.assign({}, base, {ma, lk, lanCuoi: lk.length ? lk[lk.length-1].slice(0,10) : (base.lanCuoi||'')}); delete p._k;
      await savePatient(p);
    }));
    let mx = 0; mas.forEach(ma => { const m = String(ma).match(/(\d+)$/); if (m) mx = Math.max(mx, +m[1]); });
    ops.push(async () => { const ref = S.db.doc('meta/dem'); const s = await ref.get(); const last = s.exists ? (+s.data().lastBN||0) : 0; await ref.set({lastBN: Math.max(last, mx, maxPatientNo())}); });
  }
  if (I.doctors.length && (doV || doD || doP) && !(S.settings.bacSi||[]).length) ops.push(() => S.db.doc('cauhinh/chung').set(Object.assign({}, S.settings, {bacSi: I.doctors})));
  if (!ops.length){ toast('Chưa chọn mục nào để nhập.'); return; }
  const go = $('#impGo'); go.disabled = true; $('#impFile').disabled = true;
  let i = 0, done = 0, fail = 0, stop = false, lastErr = null; const bar = $('#impProg > div'), msg = $('#impMsg');
  const worker = async () => { while (!stop && i < ops.length){ const op = ops[i++]; try { await withRetry(op, 5); } catch(e){ fail++; lastErr = e; if (e && ['quota_exceeded','revoked','invalid_argument'].includes(e.code)) stop = true; } done++; if (done % 5 === 0 || done === ops.length){ bar.style.width = (done/ops.length*100).toFixed(1)+'%'; msg.textContent = `Đang nhập ${fmt(done)}/${fmt(ops.length)}…`; } } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  bar.style.width = '100%';
  msg.textContent = fail ? `Xong, ${fmt(fail)} mục lỗi. ${errMsg(lastErr)}` : `Đã nhập xong ${fmt(done)} mục.`;
  S.histCache.clear(); S.tkData = null; $('#impFile').disabled = false;
  if (!fail) toast('Nhập dữ liệu thành công.');
}

/* ================= boot ================= */
function bindHeader(){
  const sd = $('#selDay'); sd.value = S.day;
  sd.onchange = () => { if (!sd.value) return; S.day = sd.value; subscribeDay(); renderAll(true); };
  $('#btnToday').onclick = () => { S.day = todayStr(); sd.value = S.day; subscribeDay(); renderAll(true); };
}
const PERM_TABS = ROUTES.filter(r => r !== 'cai-dat');
async function loadStaff(){
  const box = $('#nvBox'); if (!box) return; const admin = isAdmin();
  try {
    const snap = await S.db.collection('nhanvien').get(); const list = snap.docs.map(d => Object.assign({email:d.id}, d.data())).sort((a,b)=> (a.quyen==='admin'?0:1)-(b.quyen==='admin'?0:1) || a.email.localeCompare(b.email));
    if (!$('#nvBox')) return;
    const nAdmin = list.filter(n => n.quyen === 'admin').length;
    const row = n => { const ad = n.quyen === 'admin'; const tabs = staffTabs(n); const self = n.email === (S.me && S.me.email);
      return `<tr data-em="${esc(n.email)}"><td><b>${esc(n.email)}</b>${self?' <span class="tag">bạn</span>':''}<div class="sm">${esc(n.ten||'')}</div></td>
      <td><select data-q ${!admin || self ? 'disabled' : ''} style="width:auto"><option value="nhanvien" ${!ad?'selected':''}>Nhân viên</option><option value="admin" ${ad?'selected':''}>Quản trị</option></select></td>
      ${PERM_TABS.map(r => `<td style="text-align:center"><input type="checkbox" data-t="${r}" ${ad || tabs.includes(r) ? 'checked' : ''} ${ad || !admin ? 'disabled' : ''} aria-label="${esc(TAB_LABELS[r])}"></td>`).join('')}
      <td style="text-align:center"><input type="checkbox" checked disabled title="Chỉ quản trị viên" ${ad?'':'style="visibility:hidden"'}></td>
      <td class="r" style="white-space:nowrap">${admin ? `<button class="btn sm" data-save>Lưu</button>${self ? '' : ` <button class="btn sm danger" data-rm>Xóa</button>`}` : ''}</td></tr>`; };
    box.innerHTML = `<p class="sm" style="margin-top:-4px">Quản trị viên vào được mọi mục, sửa danh mục thuốc, cài đặt và phân quyền. Nhân viên chỉ thấy các mục được tích. Đổi quyền có hiệu lực ngay trên máy của người đó.</p>
      <div class="scroll"><table><thead><tr><th>Email</th><th>Vai trò</th>${PERM_TABS.map(r => `<th style="text-align:center;white-space:normal;min-width:70px">${esc(TAB_LABELS[r])}</th>`).join('')}<th style="text-align:center">Cài đặt</th><th></th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div>
      ${admin ? `<h3 style="font-size:14px;margin:16px 0 8px">Thêm người dùng</h3><div class="f3" style="grid-template-columns:2fr 1.5fr 1fr auto;align-items:end"><div class="field"><label>Email</label><input type="text" id="nvEmail" inputmode="email"></div><div class="field"><label>Họ tên</label><input type="text" id="nvTen"></div><div class="field"><label>Vai trò</label><select id="nvQ"><option value="nhanvien">Nhân viên</option><option value="admin">Quản trị</option></select></div><div class="field"><button class="btn primary" id="nvAdd">Thêm</button></div></div><p class="sm" style="margin:0">Nhân viên mới mặc định được dùng: ${DEFAULT_STAFF_TABS.map(r => TAB_LABELS[r]).join(', ')}. Người được thêm tự bấm “Tạo tài khoản” ở màn hình đăng nhập bằng đúng email này.</p>` : '<p class="sm">Chỉ quản trị viên được phân quyền.</p>'}`;
    $$('#nvBox tr[data-em]').forEach(tr => {
      const em = tr.dataset.em; const q = $('[data-q]', tr);
      q && (q.onchange = () => { const ad = q.value === 'admin'; $$('[data-t]', tr).forEach(c => { c.disabled = ad; if (ad) c.checked = true; }); });
      const sv = $('[data-save]', tr); if (sv) sv.onclick = async () => {
        const cur = list.find(n => n.email === em); const quyen = q.value; const tabs = $$('[data-t]', tr).filter(c => c.checked).map(c => c.dataset.t);
        if (cur.quyen === 'admin' && quyen !== 'admin' && nAdmin <= 1){ toast('Phải còn ít nhất một quản trị viên.'); return; }
        try { await S.db.doc('nhanvien/' + em).set(Object.assign({}, cur, {quyen, tabs: quyen === 'admin' ? PERM_TABS : tabs, email: undefined, capNhatLuc: new Date().toISOString()})); toast('Đã lưu quyền của ' + em); loadStaff(); } catch(e){ toast(errMsg(e)); }
      };
      const rm = $('[data-rm]', tr); if (rm) rm.onclick = async () => {
        const cur = list.find(n => n.email === em); if (cur.quyen === 'admin' && nAdmin <= 1){ toast('Phải còn ít nhất một quản trị viên.'); return; }
        if (!(await confirmBox('Xóa người dùng?', em + ' sẽ không dùng được app nữa.', 'Xóa'))) return;
        try { await S.db.doc('nhanvien/' + em).delete(); loadStaff(); } catch(e){ toast(errMsg(e)); }
      };
    });
    const add = $('#nvAdd'); if (add) add.onclick = async () => { const em = $('#nvEmail').value.trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast('Email không hợp lệ.'); return; } const quyen = $('#nvQ').value; try { await S.db.doc('nhanvien/' + em).set({quyen, ten: $('#nvTen').value.trim(), tabs: quyen === 'admin' ? PERM_TABS : DEFAULT_STAFF_TABS, themLuc: new Date().toISOString()}); toast('Đã thêm ' + em); loadStaff(); } catch(e){ toast(errMsg(e)); } };
  } catch(e){ const b = $('#nvBox'); if (b) b.innerHTML = '<div class="sm bad">Không tải được danh sách nhân viên.</div>'; }
}
function blobDownloader(){ return { save: async ({filename, data}) => { const blob = data instanceof Blob ? data : new Blob([data], {type: /\.html$/.test(filename) ? 'text/html' : 'application/octet-stream'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return {status:'saved'}; } }; }
function fbConfigured(){ const c = window.FIREBASE_CONFIG; return !!(c && c.apiKey && !/^YOUR_|^DIEN_/.test(c.apiKey) && window.firebase); }
function showLogin(msg){ $('#login').classList.add('show'); $('#lgMsg').textContent = msg || ''; }
function bootFirebase(){
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const fs = firebase.firestore();
  try { fs.settings({ignoreUndefinedProperties:true}); } catch(e){}
  try { fs.enablePersistence({synchronizeTabs:true}).catch(()=>{}); } catch(e){}
  const auth = firebase.auth(); S.dl = blobDownloader();
  const em = () => $('#lgEmail').value.trim().toLowerCase(), pw = () => $('#lgPass').value;
  const fbErr = e => ({'auth/invalid-credential':'Sai email hoặc mật khẩu.','auth/wrong-password':'Sai mật khẩu.','auth/user-not-found':'Chưa có tài khoản với email này.','auth/email-already-in-use':'Email đã có tài khoản, hãy đăng nhập.','auth/weak-password':'Mật khẩu cần ít nhất 6 ký tự.','auth/invalid-email':'Email không hợp lệ.','auth/too-many-requests':'Thử quá nhiều lần, đợi một lát.','auth/network-request-failed':'Không có mạng.'})[e && e.code] || ('Lỗi: ' + (e && e.code || e));
  $('#lgGo').onclick = async () => { try { await auth.signInWithEmailAndPassword(em(), pw()); } catch(e){ $('#lgMsg').textContent = fbErr(e); } };
  $('#lgPass').onkeydown = e => { if (e.key === 'Enter') $('#lgGo').click(); };
  $('#lgSignup').onclick = async () => { try { const c = await auth.createUserWithEmailAndPassword(em(), pw()); try { await c.user.sendEmailVerification(); } catch(e){} } catch(e){ $('#lgMsg').textContent = fbErr(e); } };
  $('#lgForgot').onclick = async () => { if (!em()){ $('#lgMsg').textContent = 'Nhập email trước.'; return; } try { await auth.sendPasswordResetEmail(em()); $('#lgMsg').textContent = 'Đã gửi email đặt lại mật khẩu.'; } catch(e){ $('#lgMsg').textContent = fbErr(e); } };
  $('#btnOut').onclick = async () => { await auth.signOut(); location.reload(); };
  auth.onAuthStateChanged(async u => {
    if (!u){ showLogin(); return; }
    const email = String(u.email||'').toLowerCase();
    if (!u.emailVerified){
      showLogin('Đã gửi email xác nhận tới ' + email + '. Mở email, bấm link xác nhận, rồi quay lại bấm “Đăng nhập”. (Không thấy thì xem thư mục Spam.)');
      $('#btnOut').hidden = false;
      $('#lgGo').onclick = async () => { try { await u.reload(); if (auth.currentUser.emailVerified){ await auth.currentUser.getIdToken(true); location.reload(); } else { try { await u.sendEmailVerification(); } catch(e){} $('#lgMsg').textContent = 'Email chưa được xác nhận. Đã gửi lại email xác nhận tới ' + email + '.'; } } catch(e){ $('#lgMsg').textContent = fbErr(e); } };
      return;
    }
    try {
      const me = await fs.doc('nhanvien/' + email).get();
      if (!me.exists){ showLogin('Tài khoản ' + email + ' chưa được cấp quyền. Nhờ quản trị viên thêm email này ở Cài đặt → Nhân viên, rồi tải lại trang.'); $('#btnOut').hidden = false; return; }
      S.me = Object.assign({email}, me.data());
      if (!S._meSub) S._meSub = fs.doc('nhanvien/' + email).onSnapshot(sn => {
        if (!sn.exists){ S.me = null; showLogin('Tài khoản ' + email + ' đã bị gỡ khỏi danh sách nhân viên.'); return; }
        const old = JSON.stringify(S.me); S.me = Object.assign({email}, sn.data());
        if (old !== JSON.stringify(S.me)){ $('#who').textContent = email + (S.me.quyen === 'admin' ? ' · quản trị' : ''); applyRoute(); }
      }, () => {});
    } catch(e){ showLogin(e && e.code === 'permission-denied' ? 'Tài khoản ' + email + ' chưa được cấp quyền.' : 'Không kiểm tra được quyền (' + (e && e.code) + ').'); $('#btnOut').hidden = false; return; }
    $('#login').classList.remove('show'); $('#who').textContent = email + (S.me.quyen === 'admin' ? ' · quản trị' : ''); $('#btnOut').hidden = false;
    if (S.db) return;
    S.db = { doc: p => fs.doc(p), collection: p => fs.collection(p), _fire: true, _fs: fs };
    S.mode = 'db'; subscribeStatic(); subscribeDay(); applyRoute();
  });
}
async function getCap(n){ try { return (window.claude && typeof window.claude.use === 'function') ? await window.claude.use(n) : null; } catch(e){ return null; } }
async function boot(){
  bindHeader(); applyRoute();
  if (fbConfigured()) return bootFirebase();
  if (!(window.claude && window.claude.use)) await sleep(1500);
  const [db, dl] = await Promise.all([getCap('db'), getCap('downloads')]);
  S.dl = dl;
  if (db){ S.db = db; S.mode = 'db'; }
  else { S.db = LocalDB(); S.mode = 'local'; S.dayLoaded = true; S.dl = S.dl || blobDownloader(); setBanner(window.FIREBASE_CONFIG ? 'Chưa điền cấu hình Firebase trong config.js — đang chạy chế độ thử, dữ liệu chỉ lưu trên trình duyệt này.' : 'Chế độ thử: dữ liệu chỉ lưu trên trình duyệt này.'); }
  subscribeStatic(); subscribeDay();
  renderAll(true);
}
boot();
})();
